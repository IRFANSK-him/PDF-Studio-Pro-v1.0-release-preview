name: Build Windows release preview

# An executable cannot be activated until its license endpoint and public signing
# key are configured. This workflow deliberately refuses unconfigured builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Python and PDF engine tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Configure PUBLIC license-client settings (required)
        shell: pwsh
        env:
          LICENSE_SERVER_URL: ${{ secrets.PDFSP_LICENSE_SERVER_URL }}
          LICENSE_SERVER_PUBLIC_KEY_PEM: ${{ secrets.PDFSP_LICENSE_SERVER_PUBLIC_KEY_PEM }}
        run: |
          if (-not $env:LICENSE_SERVER_URL -or -not $env:LICENSE_SERVER_PUBLIC_KEY_PEM) {
            throw 'Set PDFSP_LICENSE_SERVER_URL and PDFSP_LICENSE_SERVER_PUBLIC_KEY_PEM as GitHub Actions secrets before building an EXE.'
          }
          if (-not $env:LICENSE_SERVER_URL.StartsWith('https://')) {
            throw 'Only HTTPS license-server URLs are allowed for a release build.'
          }
          $cfg = @{
            server_url = $env:LICENSE_SERVER_URL
            server_public_key_pem = $env:LICENSE_SERVER_PUBLIC_KEY_PEM
          } | ConvertTo-Json -Depth 4
          Set-Content -Path 'config/license_client.json' -Value $cfg -Encoding UTF8
      - name: Validate release configuration
        run: python scripts/release_preflight.py
      - name: Build portable Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PDF-Studio-Pro --icon assets/pdfstudio.ico
          --add-data "assets;assets"
          --add-data "config/license_client.json;config"
          app.py
      - name: Build Windows installer (if Inno Setup is available)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is missing.' }
          & $iscc installer/PDFStudioPro.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-v1.0-Portable-Preview
          path: dist/PDF-Studio-Pro/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-v1.0-Installer-Preview
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30
